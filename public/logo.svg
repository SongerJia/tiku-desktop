<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B7CFA"/>
      <stop offset="100%" stop-color="#7B46C4"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e7fb"/>
    </linearGradient>
  </defs>
  <!-- 圆角底 + 渐变 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <!-- 白色大开本书（粗线条 + 大块面，避免小尺寸糊） -->
  <path d="M14 22 C20 20 26 19.5 32 19.8 C38 19.5 44 20 50 22 L50 47 C44 45 38 44.5 32 44.8 C26 44.5 20 45 14 47 Z"
        fill="url(#bookGrad)"/>
  <!-- 右页翻起层（景深） -->
  <path d="M32 19.8 C38 19.5 44 20 50 22 L50 47 C44 45 38 44.5 32 44.8 Z"
        fill="#c9d2f5"/>
  <!-- 书脊线（更粗，保证小尺寸可见） -->
  <line x1="32" y1="19.8" x2="32" y2="44.8" stroke="rgba(90,100,170,0.55)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 左页文字线（3 条，更粗） -->
  <line x1="18.5" y1="28" x2="28.5" y2="28.5" stroke="rgba(95,105,175,0.65)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="18.5" y1="34" x2="28.5" y2="34.5" stroke="rgba(95,105,175,0.65)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="18.5" y1="40" x2="28.5" y2="40.5" stroke="rgba(95,105,175,0.65)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- 记忆之星（粗线条，大块面） -->
  <path d="M50 9 L51.8 12.6 L55.6 13.2 L51.8 13.8 L50 17.4 L48.2 13.8 L44.4 13.2 L48.2 12.6 Z"
        fill="#ffffff" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
</svg>
