<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>知识记忆小助手</title>
  <!-- Capacitor WebView 启动壳：加载 boot.js 初始化 SQL.js db + window.capacitorBridge。
       前端 UI（Vue 应用）在 P5 移动端接入时引入；当前壳仅用于验证数据层引导。
       本文件位于 public-mobile/，由 vite build 原样拷贝到 dist-mobile/。 -->
</head>
<body>
  <div id="app" style="font-family:system-ui,-apple-system,sans-serif;padding:16px;color:#333">
    <p>知识记忆小助手（移动端数据层引导）</p>
    <p id="status" style="font-size:13px;color:#888">初始化中…</p>
  </div>
  <script type="module" src="boot.js"></script>
  <script type="module">
    import { boot } from './boot.js'
    boot().then(() => {
      const n = Object.keys(window.capacitorBridge.api).length
      document.getElementById('status').textContent = '数据层就绪：' + n + ' 个方法（109 数据 + 18 平台占位）'
    }).catch(e => {
      document.getElementById('status').textContent = '启动失败：' + (e && e.message || e)
    })
  </script>
</body>
</html>
